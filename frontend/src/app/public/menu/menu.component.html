<app-site-nav></app-site-nav>

<section class="menu-page">
  <h1 class="venue-display-font">Menu</h1>

  @if (menus().length === 0) {
    <p class="empty">No menu files have been uploaded yet.</p>
  }

  @for (menu of menus(); track menu.id) {
    <div class="menu-item">
      @if (menu.title) {
        <h2>{{ menu.title }}</h2>
      }
      @if (isImage(menu.contentType)) {
        <img [src]="fileUrl(menu.id)" [alt]="menu.title || 'Menu'" />
      } @else {
        <iframe [src]="trustedFileUrl(menu.id)" class="pdf-embed"></iframe>
      }
    </div>
  }
</section>

<app-site-footer></app-site-footer>
