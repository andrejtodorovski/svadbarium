<app-site-nav></app-site-nav>

<section class="calendar-page">
  <h1 class="venue-display-font">Достапност</h1>
  @if (loadFailed()) {
    <app-load-error
      message="Не успеавме да ја вчитаме достапноста. Проверете ја интернет врската и обидете се повторно."
      (retry)="retry()"
    />
  } @else {
    <p class="hint">Зелените датуми се слободни, црвените се веќе резервирани.</p>
    <full-calendar [options]="calendarOptions"></full-calendar>
  }
</section>

<app-site-footer></app-site-footer>
