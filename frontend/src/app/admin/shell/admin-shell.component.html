<mat-toolbar class="admin-toolbar">
  <span class="brand venue-display-font">Admin</span>
  <span class="spacer"></span>
  <a mat-button href="/" target="_blank">View site</a>
  <button mat-button (click)="logout()">Logout</button>
</mat-toolbar>

<mat-sidenav-container class="admin-container">
  <mat-sidenav mode="side" opened class="admin-sidenav">
    <mat-nav-list>
      <a
        mat-list-item
        routerLink="/admin"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Dashboard</a
      >
      <a mat-list-item routerLink="/admin/settings" routerLinkActive="active-link">Venue Settings</a>
      <a mat-list-item routerLink="/admin/gallery" routerLinkActive="active-link">Gallery</a>
      <a mat-list-item routerLink="/admin/reviews" routerLinkActive="active-link">Reviews</a>
      <a mat-list-item routerLink="/admin/menus" routerLinkActive="active-link">Menus</a>
      <a mat-list-item routerLink="/admin/availability" routerLinkActive="active-link">Availability</a>
      <a mat-list-item routerLink="/admin/inquiries" routerLinkActive="active-link">Enquiries</a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="admin-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
