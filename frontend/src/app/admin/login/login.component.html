<div class="login-page">
  <mat-card class="login-card">
    <h1 class="venue-display-font">Admin Login</h1>

    <form (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput name="username" [(ngModel)]="username" required autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading()" class="full-width">
        {{ loading() ? 'Logging in...' : 'Log in' }}
      </button>
    </form>
  </mat-card>
</div>
