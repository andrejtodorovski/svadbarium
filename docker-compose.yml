services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: venuedb
      POSTGRES_USER: venue
      POSTGRES_PASSWORD: venue_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venue -d venuedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/venuedb
      DATABASE_USERNAME: venue
      DATABASE_PASSWORD: venue_dev_password
      JWT_SECRET: local-dev-only-change-me-local-dev-only-change-me
      # admin / changeme123 — local dev only, see docs/new-venue-checklist.md for real deployments
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: $$2a$$10$$ezQ2ycTY9Wb7xMiqS79ZHO/BsJxOKnYZrkwMNRaCIFeYqyeHor726

volumes:
  pgdata:
